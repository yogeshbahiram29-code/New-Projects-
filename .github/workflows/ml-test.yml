# Upgrade 5: machine-learning out-of-sample test (train 2015-2022, test 2023+).
# Manual only: Actions -> "ML test" -> Run workflow. Result: journal/ml_report.txt (+ Telegram).
name: ML test

on:
  workflow_dispatch:
    inputs:
      start:
        description: "first year of history"
        default: "2015-01-01"
        required: true
      test_start:
        description: "train before this date, test from it"
        default: "2023-01-01"
        required: true
      send:
        description: "send the report to Telegram/WhatsApp"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: swingbot-journal
  cancel-in-progress: false

jobs:
  ml:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas numpy PyYAML requests yfinance scikit-learn
      - name: Restore long price history cache
        uses: actions/cache@v4
        with:
          path: data_cache
          key: prices-long-${{ github.run_id }}
          restore-keys: prices-long-
      - name: Train and test
        shell: bash
        env:
          PYTHONWARNINGS: ignore
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE || vars.WHATSAPP_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY || vars.CALLMEBOT_API_KEY }}
          NOTIFY_PROVIDER: ${{ vars.NOTIFY_PROVIDER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail
          ARGS=(--start "${{ inputs.start }}" --test-start "${{ inputs.test_start }}")
          [ "${{ inputs.send }}" = "true" ] && ARGS+=(--send)
          python -m swingbot ml-test "${ARGS[@]}" 2>&1 | grep -v "Pandas4Warning\|inplace\|whatsnew\|Failed download\|possibly delisted"
      - name: Save report
        run: |
          git config user.name "swingbot"
          git config user.email "swingbot@users.noreply.github.com"
          git add journal/ml_report.txt
          git diff --cached --quiet || (git commit -m "ml: out-of-sample test report" && git pull --rebase && git push)
