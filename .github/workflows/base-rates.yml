# Rebuild the historical-odds table used by the Top-5 watchlist (journal/base_rates.csv).
# Runs every Saturday; also runnable by hand: Actions -> "Refresh odds" -> Run workflow.
name: Refresh odds

on:
  schedule:
    - cron: "30 1 * * 6"     # Saturday 07:00 IST
  workflow_dispatch:
    inputs:
      start:
        description: "first year of history to use"
        default: "2015-01-01"
        required: true

permissions:
  contents: write

concurrency:
  group: swingbot-journal
  cancel-in-progress: false

jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas numpy PyYAML requests yfinance
      - name: Restore long price history cache
        uses: actions/cache@v4
        with:
          path: data_cache
          key: prices-long-${{ github.run_id }}
          restore-keys: prices-long-
      - name: Build odds table
        shell: bash
        env:
          PYTHONWARNINGS: ignore
        run: python -m swingbot base-rates --start "${{ inputs.start || '2015-01-01' }}" 2>&1 | grep -v "Pandas4Warning\|inplace\|whatsnew\|Failed download\|possibly delisted"
      - name: Save table
        run: |
          git config user.name "swingbot"
          git config user.email "swingbot@users.noreply.github.com"
          git add journal/base_rates.csv
          git diff --cached --quiet || (git commit -m "odds: refresh historical base rates" && git pull --rebase && git push)
